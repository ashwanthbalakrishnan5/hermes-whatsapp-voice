name: hermes-whatsapp-voice
label: WhatsApp Voice Calls
kind: standalone
version: 0.2.1
manifest_version: 2
api_version: 1
description: >-
  Live voice calls with Hermes over WhatsApp. Call your bot's number and talk to
  Hermes, or let Hermes call you for things that matter. Uses a linked-device
  sidecar and Gemini Live speech-to-speech.
author: Ashwanth Balakrishnan
license: MIT
homepage: https://github.com/ashwanthbalakrishnan5/hermes-whatsapp-voice
tags: [whatsapp, voice, calls, gemini-live]
platforms: [linux, macos]
requires_hermes: ">=0.21.6"
provides_tools:
  - whatsapp_call_owner
  - whatsapp_call_status
provides_hooks:
  - pre_gateway_dispatch
# Gemini: reuses the key of Hermes's own Gemini provider (GOOGLE_API_KEY, else GEMINI_API_KEY).
optional_env:
  - name: GOOGLE_API_KEY
    description: "Gemini API key, shared with Hermes's Gemini provider (only needed if Hermes doesn't have one yet)"
    url: "https://aistudio.google.com/apikey"
    secret: true
  - name: API_SERVER_KEY
    description: "Hermes API server key; lets the voice agent hand real work to Hermes during a call"
    secret: true
config_schema:
  context_mode:
    type: str
    default: "separate"
    choices: ["separate", "core_session"]
    label: "Call context"
    description: "separate: a small voice agent with a short briefing that asks Hermes for help (cheapest). core_session: the voice is the model of your WhatsApp chat with Hermes (same prompt, history and tools; the call is saved into that chat); every reply re-reads that context, so calls cost several times more."
  owner_number:
    type: str
    default: ""
    required: true
    label: "Your WhatsApp number"
    description: "International format, e.g. +15551234567. The only number called, and the only caller answered."
  voice_model:
    type: str
    default: "gemini-3.8-live"
    label: "Voice model"
    description: "Gemini Live model ID."
  voice:
    type: str
    default: "Kore"
    label: "Voice"
    description: "Gemini prebuilt voice, e.g. Kore, Puck, Charon."
  assistant_name:
    type: str
    default: "Hermes"
    label: "Fallback name"
    description: "Used only when Hermes gives no persona briefing."
  languages:
    type: str
    default: ""
    label: "Languages"
    description: "Comma-separated language codes the voice may speak, e.g. en-US, ta-IN. Speech recognition takes them only as hints; if it mishears you, also set Main spoken language. Empty: any language."
  speech_language:
    type: str
    default: ""
    choices: ["", "en-US", "en-IN", "en-GB", "en-AU", "ta-IN", "hi-IN", "te-IN", "kn-IN", "ml-IN", "mr-IN", "bn-IN", "gu-IN", "de-DE", "es-US", "es-ES", "fr-FR", "fr-CA", "it-IT", "pt-BR", "nl-NL", "pl-PL", "ru-RU", "tr-TR", "ar-XA", "id-ID", "vi-VN", "th-TH", "ja-JP", "ko-KR", "cmn-CN"]
    label: "Main spoken language"
    description: "The language you mostly speak on calls. Gemini uses it to recognise your speech and for its own voice, and it is much stronger than the Languages hints. Blank lets Gemini detect it."
  voice_instructions:
    type: str
    default: ""
    label: "Voice instructions"
    description: "Your own rules for the voice: language, tone, call length."
  ring_timeout_seconds:
    type: int
    default: 45
    label: "Ring time (seconds)"
    description: "How long an outgoing call rings before it counts as unanswered."
  max_call_minutes:
    type: int
    default: 15
    label: "Longest call (minutes)"
    description: "Calls end automatically after this."
  silence_hangup_seconds:
    type: int
    default: 180
    label: "Hang up after silence (seconds)"
    description: "Ends a call when nobody has spoken for this long, e.g. left on hold."
  pause_before_reply_ms:
    type: int
    default: 600
    label: "Pause before it replies (ms)"
    description: "How long you can pause mid-sentence before the voice takes it that you have finished and answers. Raise it if it cuts you off; lower it for snappier replies."
  hangup_grace_seconds:
    type: int
    default: 3
    label: "Hang up after goodbye (seconds)"
    description: "Quiet time after the assistant's goodbye before it hangs up. Speaking in that time keeps the call going."
  hermes_timeout_seconds:
    type: int
    default: 180
    label: "Hermes time limit (seconds)"
    description: "How long the voice waits for Hermes on one request (and for the call summary) before giving up."
  max_silent_tools:
    type: int
    default: 5
    label: "Tools before speaking"
    description: "How many tools the voice may run in a row before it must tell you what it is doing."
  record_calls:
    type: bool
    default: false
    label: "Record my side of calls"
    description: "Save your audio from each call as a WAV file in the plugin's data folder (recordings/), on this machine only. For testing and debugging; off by default."
  answer_inbound:
    type: bool
    default: true
    label: "Answer my calls"
    description: "Pick up when your number calls the bot. Other callers are never answered."
  send_summary:
    type: bool
    default: true
    label: "Send call summary"
    description: "Message a short WhatsApp summary after each call."
  voice_tools:
    type: str
    default: "memory, session_search, skills_list, skill_view, web_search, web_extract, read_file, search_files, todo_list, hindsight_recall, hindsight_retain, hindsight_reflect"
    label: "Voice tools"
    description: "core_session: comma-separated Hermes tools the voice uses itself for quick lookups. Real jobs (commands, changes, multi-step work) go to your main model through ask_hermes_deep."
  history_chars:
    type: int
    default: 30000
    label: "Chat history for calls (characters)"
    description: "core_session: how much recent chat history the voice gets at the start of a call."
  vocabulary:
    type: str
    default: ""
    label: "Spellings"
    description: "Comma-separated words transcripts should spell as given, e.g. names. Your own name is added automatically."
  live_config:
    type: dict
    default: {}
    label: "Gemini Live overrides"
    description: "Any Live API setup field, merged over the defaults. Reference: https://ai.google.dev/api/live"
  listen:
    type: str
    default: "127.0.0.1:8796"
    label: "Sidecar address"
    description: "Loopback address of the sidecar's local API."
  context_listen:
    type: str
    default: "127.0.0.1:8797"
    label: "Core session address"
    description: "core_session: loopback address of the plugin's context service."
  voice_api_url:
    type: str
    default: "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent"
    label: "Voice model endpoint"
    description: "Gemini Live WebSocket URL. Change only to use a proxy."
  hermes_api_url:
    type: str
    default: "http://127.0.0.1:8642"
    label: "Hermes API URL"
    description: "Where the voice reaches Hermes."
