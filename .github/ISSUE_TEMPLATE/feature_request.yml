name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please search [open issues](https://github.com/ashwanthbalakrishnan5/hermes-whatsapp-voice/issues)
        first. If one already covers it, add a comment or a 👍 there instead.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: dropdown
    id: pr
    attributes:
      label: Would you send a PR?
      options:
        - "Yes"
        - Maybe, with some guidance
        - "No"
